[project]
name = "avdan-api"
version = "0.1.0"
description = "AVDAN logistics and commerce platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "gunicorn>=23,<24",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "PyJWT>=2.10,<3.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28,<0.29",
    "email-validator>=2.3.0",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
