services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avdan
      POSTGRES_PASSWORD: avdan_dev
      POSTGRES_DB: avdan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avdan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://avdan:avdan_dev@postgres:5432/avdan
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=development
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    volumes:
      - ./apps/api:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://avdan:avdan_dev@postgres:5432/avdan
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - apps/api/.env
    depends_on:
      - redis
      - postgres
    command: celery -A workers.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    volumes:
      - ./apps/api:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://avdan:avdan_dev@postgres:5432/avdan
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - apps/api/.env
    depends_on:
      - redis
    command: celery -A workers.celery_app beat --loglevel=info

  web-customer:
    build:
      context: apps/web-customer
      dockerfile: ../../infra/docker/web/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web-customer:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_INTERNAL_URL=http://api:8000
    env_file:
      - apps/web-customer/.env.local
    depends_on:
      - api

  web-vendor:
    build:
      context: apps/web-vendor
      dockerfile: ../../infra/docker/web/Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./apps/web-vendor:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_INTERNAL_URL=http://api:8000
    env_file:
      - apps/web-vendor/.env.local
    depends_on:
      - api

  web-admin:
    build:
      context: apps/web-admin
      dockerfile: ../../infra/docker/web/Dockerfile
    ports:
      - "3002:3000"
    volumes:
      - ./apps/web-admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_INTERNAL_URL=http://api:8000
    env_file:
      - apps/web-admin/.env.local
    depends_on:
      - api

  web-hub:
    build:
      context: apps/web-hub
      dockerfile: ../../infra/docker/web/Dockerfile
    ports:
      - "3003:3000"
    volumes:
      - ./apps/web-hub:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_INTERNAL_URL=http://api:8000
    env_file:
      - apps/web-hub/.env.local
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
