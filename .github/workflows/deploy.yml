name: Deploy

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/avdan

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set deploy namespace
        id: ns
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "namespace=avdan-app" >> $GITHUB_OUTPUT
          else
            echo "namespace=avdan-staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-customer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          build-args: APP_NAME=web-customer
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-customer:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-vendor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          build-args: APP_NAME=web-vendor
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-vendor:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          build-args: APP_NAME=web-admin
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-admin:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-hub image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          build-args: APP_NAME=web-hub
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-hub:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Rolling deploy
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          NS=${{ steps.ns.outputs.namespace }}
          kubectl set image deployment/api          api=${{ env.IMAGE_PREFIX }}/api:$SHA          -n $NS
          kubectl set image deployment/celery-worker celery-worker=${{ env.IMAGE_PREFIX }}/api:$SHA -n $NS
          kubectl set image deployment/celery-beat  celery-beat=${{ env.IMAGE_PREFIX }}/api:$SHA  -n $NS
          kubectl set image deployment/web-customer web-customer=${{ env.IMAGE_PREFIX }}/web-customer:$SHA -n $NS
          kubectl set image deployment/web-vendor   web-vendor=${{ env.IMAGE_PREFIX }}/web-vendor:$SHA   -n $NS
          kubectl set image deployment/web-admin    web-admin=${{ env.IMAGE_PREFIX }}/web-admin:$SHA     -n $NS
          kubectl set image deployment/web-hub      web-hub=${{ env.IMAGE_PREFIX }}/web-hub:$SHA         -n $NS

      - name: Wait for rollout
        run: |
          NS=${{ steps.ns.outputs.namespace }}
          kubectl rollout status deployment/api           -n $NS --timeout=300s
          kubectl rollout status deployment/celery-worker -n $NS --timeout=300s
          kubectl rollout status deployment/web-customer  -n $NS --timeout=300s
          kubectl rollout status deployment/web-vendor    -n $NS --timeout=300s
          kubectl rollout status deployment/web-admin     -n $NS --timeout=300s
          kubectl rollout status deployment/web-hub       -n $NS --timeout=300s
