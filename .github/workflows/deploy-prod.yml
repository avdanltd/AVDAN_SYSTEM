name: Production — CI → Build → Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # never cancel a production deploy in flight

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/avdan

jobs:
  ci:
    name: CI — build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_APP_NAME: AVDAN
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          API_INTERNAL_URL: http://localhost:8000

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync

  # The six images are independent, so they build side by side instead of one after another, and
  # alongside the CI check rather than behind it. Each keeps its layer cache in the registry
  # (GitHub's own cache is capped at 10 GB and six apps evict each other).
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            file: infra/docker/api/Dockerfile
            build_args: ""
            stable_tag: "true"
          - app: web-customer
            file: infra/docker/web/Dockerfile
            build_args: APP_NAME=web-customer
          - app: web-vendor
            file: infra/docker/web/Dockerfile
            build_args: APP_NAME=web-vendor
          - app: web-admin
            file: infra/docker/web/Dockerfile
            build_args: APP_NAME=web-admin
          - app: web-hub
            file: infra/docker/web/Dockerfile
            build_args: APP_NAME=web-hub
          - app: web-rider
            file: infra/docker/web/Dockerfile
            build_args: APP_NAME=web-rider

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}"
            if [ "${{ matrix.stable_tag }}" = "true" ]; then
              echo "${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:stable"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          target: production
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [ci, build]  # still gated on CI; it just runs alongside the image builds now
    environment: production  # requires manual approval in GitHub repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose files to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avdan/
          scp -i ~/.ssh/deploy_key \
            infra/nginx/nginx.prod.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avdan/infra/nginx/
          # docker-compose.prod.yml bind-mounts these two FILES into db-backup. If either is missing
          # when compose starts, Docker creates an empty DIRECTORY at that path, and every later
          # deploy then fails ("not a directory: Are you trying to mount a directory onto a file")
          # because scp drops the file inside that directory. Remove any such directory first.
          # Docker creates them as root, which the deploy user can't delete. So the cleanup runs
          # in a throwaway container (as root, no sudo needed — the deploy user already drives
          # docker). It also hands the backup dir back to the deploy user so the scp below can
          # write into it. The image is the one db-backup already uses, so nothing extra is pulled.
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            mkdir -p /opt/avdan/infra/docker/backup
            docker run --rm --entrypoint sh -v /opt/avdan/infra/docker/backup:/b postgres:16-alpine -c \
              'for f in backup-db.sh crontab; do if [ -d /b/\$f ]; then rm -rf /b/\$f; fi; done; chown '\$(id -u):\$(id -g)' /b'
          "
          scp -i ~/.ssh/deploy_key \
            infra/docker/backup/backup-db.sh \
            infra/docker/backup/crontab \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avdan/infra/docker/backup/

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /opt/avdan
            echo IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} > .env.deploy
            echo IMAGE_TAG=${{ steps.tag.outputs.sha }}  >> .env.deploy
            grep -v '^IMAGE_' .env 2>/dev/null > .env.merged || true
            cat .env.deploy >> .env.merged
            mv .env.merged .env
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm api uv run alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "

      - name: Verify production is up
        run: |
          # Hit this server's own nginx (not public DNS), so the check is about THIS deploy even
          # while the domain still points elsewhere, e.g. during a cutover to a new server.
          # Polls until it answers (up to ~90 s) instead of always waiting a fixed 20 s.
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          for i in $(seq 1 30); do
            if curl -skf --resolve api.avdanstore.com:443:127.0.0.1 https://api.avdanstore.com/health -o /dev/null \
               && curl -skf --resolve avdanstore.com:443:127.0.0.1 https://avdanstore.com/favicon.ico -o /dev/null; then
              break
            fi
            sleep 3
          done
          docker compose -f /opt/avdan/docker-compose.prod.yml ps --format 'table {{.Name}}\t{{.Status}}'
          curl -skf --resolve avdanstore.com:443:127.0.0.1 https://avdanstore.com/favicon.ico -o /dev/null && echo 'avdanstore.com: OK'
          curl -skf --resolve api.avdanstore.com:443:127.0.0.1 https://api.avdanstore.com/health && echo 'api.avdanstore.com: OK'
          REMOTE
