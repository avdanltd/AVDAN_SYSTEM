name: Staging — CI → Build → Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/avdan

jobs:
  ci:
    name: CI — build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_APP_NAME: AVDAN
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          API_INTERNAL_URL: http://localhost:8000

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync

  build-and-deploy:
    name: Build → Push → Deploy to staging
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api/Dockerfile
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web-customer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          target: production
          build-args: APP_NAME=web-customer
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-customer:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-customer
          cache-to: type=gha,mode=max,scope=web-customer

      - name: Build and push web-vendor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          target: production
          build-args: APP_NAME=web-vendor
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-vendor:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-vendor
          cache-to: type=gha,mode=max,scope=web-vendor

      - name: Build and push web-admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          target: production
          build-args: APP_NAME=web-admin
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-admin:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-admin
          cache-to: type=gha,mode=max,scope=web-admin

      - name: Build and push web-hub image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          target: production
          build-args: APP_NAME=web-hub
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-hub:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-hub
          cache-to: type=gha,mode=max,scope=web-hub

      - name: Build and push web-rider image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          target: production
          build-args: APP_NAME=web-rider
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web-rider:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web-rider
          cache-to: type=gha,mode=max,scope=web-rider

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose files to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avdan/
          scp -i ~/.ssh/deploy_key \
            infra/nginx/nginx.prod.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avdan/infra/nginx/

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /opt/avdan
            echo IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} > .env.deploy
            echo IMAGE_TAG=${{ steps.tag.outputs.sha }}  >> .env.deploy
            grep -v '^IMAGE_' .env 2>/dev/null > .env.merged || true
            cat .env.deploy >> .env.merged
            mv .env.merged .env
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "

      - name: Health check
        run: |
          sleep 15
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker compose -f /opt/avdan/docker-compose.prod.yml ps --format 'table {{.Name}}\t{{.Status}}'"
