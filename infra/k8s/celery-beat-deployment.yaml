apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: avdan-app
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  strategy:
    # Recreate ensures the old pod is terminated before the new one starts.
    # RollingUpdate would allow two Beat instances to run simultaneously, causing duplicate tasks.
    type: Recreate
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/OWNER/avdan/api:latest
          command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: avdan-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
# Ensures at most 0 voluntary disruptions — Beat must never go to 0 replicas involuntarily
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-beat-pdb
  namespace: avdan-app
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: celery-beat
