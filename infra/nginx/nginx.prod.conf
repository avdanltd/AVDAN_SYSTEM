events {
    worker_connections 2048;
}

http {
    # Trust Cloudflare edge IPs so real client IP is logged
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Shared SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Wildcard cert paths (certbot DNS challenge issues one cert for all subdomains)
    ssl_certificate     /etc/letsencrypt/live/avdanstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avdanstore.com/privkey.pem;

    # Upstreams — container names match docker-compose.prod.yml service names
    upstream web-customer { server web-customer:3000; }
    upstream web-vendor   { server web-vendor:3000; }
    upstream web-admin    { server web-admin:3000; }
    upstream web-hub      { server web-hub:3000; }
    upstream web-rider    { server web-rider:3000; }
    upstream api          { server api:8000; }

    # Shared proxy headers snippet
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP → HTTPS redirect (all hosts)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # www redirect to apex
    server {
        listen 443 ssl;
        server_name www.avdanstore.com;
        return 301 https://avdanstore.com$request_uri;
    }

    # Customer app — avdanstore.com
    server {
        listen 443 ssl;
        server_name avdanstore.com;

        location / {
            proxy_pass http://web-customer;
        }
    }

    # Vendor dashboard — vendor.avdanstore.com
    server {
        listen 443 ssl;
        server_name vendor.avdanstore.com;

        location / {
            proxy_pass http://web-vendor;
        }
    }

    # Admin panel — admin.avdanstore.com
    server {
        listen 443 ssl;
        server_name admin.avdanstore.com;

        location / {
            proxy_pass http://web-admin;
        }
    }

    # Hub portal — hub.avdanstore.com
    server {
        listen 443 ssl;
        server_name hub.avdanstore.com;

        location / {
            proxy_pass http://web-hub;
        }
    }

    # Rider web app — rider.avdanstore.com
    server {
        listen 443 ssl;
        server_name rider.avdanstore.com;

        location / {
            proxy_pass http://web-rider;
        }
    }

    # FastAPI — api.avdanstore.com
    server {
        listen 443 ssl;
        server_name api.avdanstore.com;

        # WebSocket upgrade for /ws/* endpoints
        location /ws/ {
            proxy_pass http://api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://api;
            proxy_read_timeout 60s;
        }
    }
}
