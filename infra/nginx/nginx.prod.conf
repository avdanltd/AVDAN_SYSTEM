events {
    worker_connections 2048;
}

http {
    # Trust Cloudflare edge IPs so real client IP is logged
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Shared SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Wildcard cert paths (certbot DNS challenge issues one cert for all subdomains)
    ssl_certificate     /etc/letsencrypt/live/avdanstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avdanstore.com/privkey.pem;

    # Docker's embedded DNS. A plain `upstream { server api:8000; }` block (the previous
    # approach here) is resolved ONCE, at nginx startup/reload, and cached for the life of
    # the worker process — nginx has no idea a container name can point at a new IP later.
    # Root-caused a live production outage (2026-09-01): the `api` container was recreated
    # by a deploy, got a new IP, and the OLD IP it vacated was later reassigned by Docker to
    # `web-hub`. nginx kept proxying every api.avdanstore.com request to web-hub's IP on
    # port 8000 (nothing listening there) -> "connect() failed (111: Connection refused)" ->
    # 502, invisible on every OTHER subdomain because their container IPs hadn't moved yet.
    # Fixed with a `resolver` + variable in proxy_pass below: that combination makes nginx
    # re-resolve the hostname at the `valid` interval instead of once, so a future container
    # recreate self-heals on its own instead of needing a manual `nginx -s reload`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared proxy headers snippet
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP → HTTPS redirect (all hosts)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # www redirect to apex
    server {
        listen 443 ssl;
        server_name www.avdanstore.com;
        return 301 https://avdanstore.com$request_uri;
    }

    # Customer app — avdanstore.com
    server {
        listen 443 ssl;
        server_name avdanstore.com;

        location / {
            set $upstream web-customer;
            proxy_pass http://$upstream:3000;
        }
    }

    # Vendor dashboard — vendor.avdanstore.com
    server {
        listen 443 ssl;
        server_name vendor.avdanstore.com;

        location / {
            set $upstream web-vendor;
            proxy_pass http://$upstream:3000;
        }
    }

    # Admin panel — admin.avdanstore.com
    server {
        listen 443 ssl;
        server_name admin.avdanstore.com;

        location / {
            set $upstream web-admin;
            proxy_pass http://$upstream:3000;
        }
    }

    # Hub portal — hub.avdanstore.com
    server {
        listen 443 ssl;
        server_name hub.avdanstore.com;

        location / {
            set $upstream web-hub;
            proxy_pass http://$upstream:3000;
        }
    }

    # Rider web app — rider.avdanstore.com
    server {
        listen 443 ssl;
        server_name rider.avdanstore.com;

        location / {
            set $upstream web-rider;
            proxy_pass http://$upstream:3000;
        }
    }

    # FastAPI — api.avdanstore.com
    server {
        listen 443 ssl;
        server_name api.avdanstore.com;

        # WebSocket upgrade for /ws/* endpoints
        location /ws/ {
            set $upstream api;
            proxy_pass http://$upstream:8000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location / {
            set $upstream api;
            proxy_pass http://$upstream:8000;
            proxy_read_timeout 60s;
        }
    }
}
